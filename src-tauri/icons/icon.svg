<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>

  <!-- 目标图标 - 主体圆圈 -->
  <circle cx="256" cy="180" r="80" fill="none" stroke="white" stroke-width="8"/>

  <!-- 目标图标 - 内圈 -->
  <circle cx="256" cy="180" r="50" fill="none" stroke="white" stroke-width="6"/>

  <!-- 目标图标 - 中心点 -->
  <circle cx="256" cy="180" r="20" fill="white"/>

  <!-- 进度条背景 -->
  <rect x="80" y="320" width="352" height="40" rx="20" fill="rgba(255,255,255,0.2)"/>

  <!-- 进度条填充 -->
  <rect x="80" y="320" width="220" height="40" rx="20" fill="rgba(255,255,255,0.8)"/>

  <!-- 日历图标背景 -->
  <rect x="150" y="380" width="80" height="80" rx="12" fill="rgba(255,255,255,0.9)"/>

  <!-- 日历图标线条 -->
  <rect x="160" y="395" width="60" height="8" rx="4" fill="#667eea"/>
  <rect x="160" y="415" width="60" height="8" rx="4" fill="#667eea"/>
  <rect x="160" y="435" width="40" height="8" rx="4" fill="#667eea"/>

  <!-- 打卡标记 -->
  <circle cx="180" cy="399" r="4" fill="#f5576c"/>
  <circle cx="180" cy="419" r="4" fill="#f5576c"/>
  <circle cx="180" cy="439" r="4" fill="#f5576c"/>

  <!-- 齿轮图标 -->
  <g transform="translate(320, 420)">
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.9)"/>
    <circle cx="0" cy="0" r="12" fill="#667eea"/>
    <!-- 齿轮齿 -->
    <rect x="-4" y="-25" width="8" height="10" rx="2" fill="rgba(255,255,255,0.9)"/>
    <rect x="-4" y="15" width="8" height="10" rx="2" fill="rgba(255,255,255,0.9)"/>
    <rect x="-25" y="-4" width="10" height="8" rx="2" fill="rgba(255,255,255,0.9)"/>
    <rect x="15" y="-4" width="10" height="8" rx="2" fill="rgba(255,255,255,0.9)"/>
  </g>
</svg>